# UI tests for VS Code on the iSH desktop: the real app, the real emulator, a hardware
# keyboard (XCUITest key events go through UIKit like an attached keyboard). Install the
# app first with AUTOMATION=1 desktop/simrun-vscode.sh, then:
#   xcodegen generate && xcodebuild test -project VSCodeHarness.xcodeproj -scheme VSCodeHost \
#     -destination 'platform=iOS Simulator,id=SIMULATOR-UDID' \
#     TEST_RUNNER_VSCODE_SHOT_DIR=/path/for/screenshots
name: VSCodeHarness
options:
  bundleIdPrefix: com.valentinneagu.vscodeharness
  deploymentTarget:
    iOS: "17.0"
targets:
  VSCodeHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
  VSCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: VSCodeHost
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: VSCodeHost
schemes:
  VSCodeHost:
    build:
      targets:
        VSCodeHost: all
        VSCodeUITests: [test]
    test:
      targets: [VSCodeUITests]
