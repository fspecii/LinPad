# Aero (glass, 7-era; desktop theme "Aero"). GTK: B00merang's Windows-7 (GPL-3.0), installed
# on first use as LinPad-Aero; the dark variant is Adwaita recoloured by the Aero Night
# palette. Fluent icons and cursors (GPL-3.0); Noto Sans stands in for Segoe UI.
STYLE_NAME="Aero"
DEFAULT_VARIANT=light
STYLE_PACKS="aero"
GTK_THEME_light=LinPad-Aero
GTK_THEME_dark=Adwaita
ICON_THEME_light=Fluent
ICON_THEME_dark=Fluent-dark
CURSOR_THEME_light=Fluent-cursors
CURSOR_THEME_dark=Fluent-dark-cursors
KVANTUM_THEME_light=Fluent
KVANTUM_THEME_dark=FluentDark
FONT="Noto Sans 9"
MONO_FONT="Noto Sans Mono 10"
CURSOR_SIZE=24
BUTTON_LAYOUT="menu:minimize,maximize,close"
