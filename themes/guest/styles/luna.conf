# Luna (XP-era blue, desktop theme "Luna"). GTK: B00merang's Windows-XP Luna (GPL-3.0),
# installed on first use as LinPad-Luna (ish-style-packs luna). Papirus icons; DejaVu
# Sans stands in for the proprietary Tahoma.
STYLE_NAME="Luna"
DEFAULT_VARIANT=light
STYLE_PACKS="luna"
GTK_THEME_light=LinPad-Luna
GTK_THEME_dark=Adwaita
ICON_THEME_light=Papirus
ICON_THEME_dark=Papirus-Dark
CURSOR_THEME_light=Adwaita
CURSOR_THEME_dark=Adwaita
KVANTUM_THEME_light=Fluent
KVANTUM_THEME_dark=KvGnomeDark
FONT="DejaVu Sans 9"
MONO_FONT="DejaVu Sans Mono 10"
CURSOR_SIZE=24
BUTTON_LAYOUT="menu:minimize,maximize,close"
