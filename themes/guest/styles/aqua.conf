# Aqua (early OS X pinstripes; desktop theme "Aqua"). GTK: B00merang's Mac-OS-X-Cheetah
# (GPL-3.0) as LinPad-Aqua; dark is WhiteSur-Dark. Qogir icons (GPL-3.0), not WhiteSur's,
# whose file manager and app store icons imitate Apple's; WhiteSur cursors and Kvantum.
# DejaVu Sans stands in for Lucida Grande.
STYLE_NAME="Aqua"
DEFAULT_VARIANT=light
STYLE_PACKS="aqua"
GTK_THEME_light=LinPad-Aqua
GTK_THEME_dark=WhiteSur-Dark
ICON_THEME_light=Qogir
ICON_THEME_dark=Qogir-Dark
ICON_FALLBACK=Papirus
CURSOR_THEME_light=WhiteSur-cursors
CURSOR_THEME_dark=WhiteSur-cursors
KVANTUM_THEME_light=WhiteSur
KVANTUM_THEME_dark=WhiteSur
FONT="DejaVu Sans 9"
MONO_FONT="DejaVu Sans Mono 10"
CURSOR_SIZE=24
BUTTON_LAYOUT="close,minimize,maximize:menu"
