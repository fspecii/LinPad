# Classic 98 (grey bevels; desktop theme "Classic 98"). GTK: Chicago95's GTK theme
# (GPL-3.0+/MIT), installed on first use as LinPad-Classic. Chicago95's icons and cursors are
# not used (they redraw vendor artwork); Papirus icons, DejaVu Sans for MS Sans Serif.
STYLE_NAME="Classic 98"
DEFAULT_VARIANT=light
STYLE_PACKS="classic"
GTK_THEME_light=LinPad-Classic
GTK_THEME_dark=LinPad-Classic
ICON_THEME_light=Papirus
ICON_THEME_dark=Papirus
CURSOR_THEME_light=Adwaita
CURSOR_THEME_dark=Adwaita
KVANTUM_THEME_light=KvYaru
KVANTUM_THEME_dark=KvYaru
FONT="DejaVu Sans 9"
MONO_FONT="DejaVu Sans Mono 10"
CURSOR_SIZE=24
BUTTON_LAYOUT="menu:minimize,maximize,close"
