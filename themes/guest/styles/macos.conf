# macOS look. WhiteSur (vinceliuice) is MIT (GTK) / GPL-3.0 (cursors); the font is Inter
# because SF Pro is proprietary. Icons are Qogir (GPL-3.0): WhiteSur's icon set imitates
# Apple's Finder and App Store icons, which LinPad does not show.
STYLE_NAME="macOS"
DEFAULT_VARIANT=light
GTK_THEME_light=WhiteSur-Light
GTK_THEME_dark=WhiteSur-Dark
ICON_THEME_light=Qogir
ICON_THEME_dark=Qogir-Dark
ICON_FALLBACK=Papirus
CURSOR_THEME_light=WhiteSur-cursors
CURSOR_THEME_dark=WhiteSur-cursors
KVANTUM_THEME_light=WhiteSur
KVANTUM_THEME_dark=WhiteSurDark
FONT="Inter 10"
MONO_FONT="Noto Sans Mono 10"
CURSOR_SIZE=24
BUTTON_LAYOUT="close,minimize,maximize:menu"
