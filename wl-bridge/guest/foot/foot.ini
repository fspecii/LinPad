# Shared by every style's foot.ini (ish-terminal picks the style).
[main]
font=JetBrains Mono:size=11
pad=8x6
term=foot

[scrollback]
lines=10000

[url]
# Cmd+Shift+O (Cmd is Ctrl in Linux windows) labels the URLs on screen; typing a
# label opens it on the iPad desktop.
launch=ish-open ${url}
osc8-underline=always

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[key-bindings]
# The left Cmd key arrives as Control, so Cmd+Shift+C/V copy and paste.
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
show-urls-launch=Control+Shift+o
