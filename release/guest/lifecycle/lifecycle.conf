# Signals linpad-lifecycle sends when LinPad leaves the screen (iPadOS may end LinPad from
# then on, without warning). One rule per line: SIGNAL COMMAND-LINE-PREFIX, e.g.
#   USR1 /usr/bin/my-editor
# sends SIGUSR1 to every process whose command line starts with "/usr/bin/my-editor".
# Only add programs that save on that signal: most programs quit on signals they do not
# handle. VS Code, Firefox and LibreOffice need no rule (LinPad sets them up to save on
# their own). Scripts in /etc/linpad/lifecycle.d (and ~/.config/linpad/lifecycle.d) run
# too, with "suspend" or "resume" as their argument.
